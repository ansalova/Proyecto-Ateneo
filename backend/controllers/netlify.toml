[build]
  # Directorio donde está el frontend
  base = "frontend"
  # Directorio donde Vite genera los archivos para producción
  publish = "dist"
  # Comando para instalar dependencias y construir
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirigir todas las peticiones /api/* hacia tu servidor backend
# Nota: Debes cambiar "https://tu-backend-en-render.com" por la URL real de tu backend
[[redirects]]
  from = "/api/*"
  to = "https://tu-backend-en-render.com/api/:splat"
  status = 200

# Manejo de rutas para Single Page Application (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200