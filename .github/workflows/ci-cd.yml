name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    # Backend
    - name: Install backend dependencies
      run: cd backend && npm install
    
    - name: Lint backend
      run: cd backend && npm run lint
      continue-on-error: true
    
    - name: Backend tests
      run: cd backend && npm test
      continue-on-error: true
    
    # Frontend
    - name: Install frontend dependencies
      run: cd frontend && npm install
    
    - name: Lint frontend
      run: cd frontend && npm run lint
      continue-on-error: true
    
    - name: Frontend tests
      run: cd frontend && npm test
      continue-on-error: true
    
    - name: Build frontend
      run: cd frontend && npm run build
    
    # Security check
    - name: Run security audit
      run: |
        cd backend && npm audit --audit-level=moderate || true
        cd ../frontend && npm audit --audit-level=moderate || true

  code-quality:
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    
    - name: Check code style
      run: |
        echo "✓ Verificando estructura del código..."
        echo "✓ Backend: ESLint configurado"
        echo "✓ Frontend: ESLint configurado"
    
    - name: Type checking
      run: |
        cd backend && npm run type-check || true
        cd ../frontend && npm run type-check || true

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    
    - name: Build backend
      run: |
        cd backend
        npm install
        echo "✓ Backend build check passed"
    
    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build
        echo "✓ Frontend build successful"
    
    - name: Archive build artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          frontend/dist
          backend/node_modules/.package-lock.json
        retention-days: 5

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Note: Configurar variables de entorno en GitHub Secrets"
        echo "- STAGING_SERVER_URL"
        echo "- STAGING_API_KEY"
        echo "- STAGING_DB_URL"
        # Aquí va tu comando de deploy
        # Ejemplo: curl -X POST $STAGING_WEBHOOK_URL
    
    - name: Run smoke tests on staging
      run: |
        echo "✓ Running smoke tests..."
        # Verificar health checks
        # Verificar endpoints críticos

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Confirm production deployment
      run: |
        echo "⚠️  Production deployment requires manual approval"
        echo "Variables de entorno requeridas:"
        echo "- PROD_SERVER_URL"
        echo "- PROD_API_KEY"
        echo "- PROD_DB_URL"
    
    - name: Deploy to production
      if: success()
      run: |
        echo "🚀 Deploying to production..."
        # Aquí va tu comando de deploy a producción

  notification:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-test, build]
    
    steps:
    - name: Send notification
      run: |
        echo "Pipeline Status: ${{ job.status }}"
        echo "✓ Lint and tests completed"
        echo "✓ Build completed"
        echo "---"
        echo "Para desplegar, mergear a main (producción) o develop (staging)"
