[build]
  # Directorio donde está el frontend
  base = "frontend"
  # Directorio donde Vite genera los archivos para producción
  publish = "dist"
  # Comando para instalar dependencias y construir
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirigir todas las peticiones /api/* hacia tu servidor backend
# IMPORTANTE: Reemplaza la URL de abajo por tu URL real de Render
[[redirects]]
  from = "/api/*"
  to = "https://ateneo-backend.onrender.com/api/:splat"
  status = 200

# Manejo de rutas para Single Page Application (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200